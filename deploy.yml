# Unga Market - Cloud Deployment & CI/CD Specification
version: "1.0"
name: unga-market-deploy

services:
  web:
    type: web
    name: unga-market
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: UPI_VPA
        value: jay.pratap.madhavan@okaxis
      - key: UPI_PAYEE_NAME
        value: "Jay Prathap"
      - key: GPAY_PHONE
        value: "9840123456"
      - key: PHONEPE_NUMBER
        value: "9840123456"
      - key: STORE_EMAIL
        value: orders@ungamarket.com
      - key: SUPPORT_EMAIL
        value: support@ungamarket.com
      - key: STORE_PIN
        value: "1234"

routes:
  - path: /*
    type: http
    target: web

notifications:
  on_success: "Deployment completed: https://ais-pre-zd6hafhjebzmkpusuvwuxh-452488806678.asia-southeast1.run.app"
  on_failure: "Deployment failed"
