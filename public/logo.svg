<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 375" width="100%" height="100%">
  <defs>
    <!-- Vibrant Cart Green Gradient -->
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18A94C"/>
      <stop offset="100%" stop-color="#0A6B2E"/>
    </linearGradient>

    <!-- Unga Green Script Gradient -->
    <linearGradient id="ungaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#149A46"/>
      <stop offset="60%" stop-color="#0E7834"/>
      <stop offset="100%" stop-color="#064E20"/>
    </linearGradient>

    <!-- Market Red-Orange Gradient -->
    <linearGradient id="marketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4116"/>
      <stop offset="65%" stop-color="#EA2604"/>
      <stop offset="100%" stop-color="#C51800"/>
    </linearGradient>

    <!-- Orange Shopping Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA200"/>
      <stop offset="100%" stop-color="#F15A00"/>
    </linearGradient>

    <!-- Carrot Gradient -->
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <!-- Bread Gradient -->
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AF77"/>
      <stop offset="100%" stop-color="#BA7F45"/>
    </linearGradient>
  </defs>

  <!-- ROOT LOGO CONTAINER -->
  <g id="unga-market-brand">
    <!-- LEFT: SPEED CART LOADED WITH FRESH GROCERIES -->
    <g transform="translate(10, 8)">
      <!-- 3 Rapid Delivery Speed Lines -->
      <path d="M 50 170 L 115 170" stroke="#0F8A3E" stroke-width="13" stroke-linecap="round"/>
      <path d="M 22 215 L 98 215" stroke="#0F8A3E" stroke-width="13" stroke-linecap="round"/>
      <path d="M 55 260 L 110 260" stroke="#0F8A3E" stroke-width="13" stroke-linecap="round"/>

      <!-- Groceries in Cart -->
      <!-- Lush Greens / Kale Background -->
      <path d="M 120 115 C 130 45, 185 55, 205 105 C 225 35, 275 55, 285 115 Z" fill="#2E7D32"/>
      <path d="M 140 95 C 155 25, 210 35, 235 85 C 265 20, 305 45, 310 110 Z" fill="#4CAF50"/>
      
      <!-- Carrot with leafy top -->
      <g transform="translate(125, 80) rotate(-24)">
        <!-- Green parsley leaves -->
        <path d="M 25 15 C 20 -15, 35 -15, 30 15 M 30 15 C 35 -20, 50 -10, 35 15" stroke="#2E7D32" stroke-width="4" fill="none"/>
        <!-- Carrot body -->
        <path d="M 15 15 Q 35 10 45 15 L 30 105 Z" fill="url(#carrotGrad)"/>
      </g>

      <!-- French Baguette Bread -->
      <g transform="translate(245, 15) rotate(32)">
        <rect x="0" y="0" width="52" height="145" rx="26" fill="url(#breadGrad)"/>
        <line x1="12" y1="35" x2="40" y2="48" stroke="#845325" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="65" x2="40" y2="78" stroke="#845325" stroke-width="4" stroke-linecap="round"/>
        <line x1="12" y1="95" x2="40" y2="108" stroke="#845325" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Fresh Milk Bottle -->
      <g transform="translate(280, 70)">
        <rect x="10" y="0" width="22" height="16" rx="4" fill="#0288D1"/>
        <path d="M 12 16 L 30 16 L 40 40 L 40 100 L 2 100 L 2 40 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
        <rect x="2" y="52" width="38" height="24" fill="#0288D1"/>
      </g>

      <!-- Yellow Banana bunch -->
      <path d="M 210 140 C 230 120, 270 130, 280 180 C 270 185, 240 175, 210 140 Z" fill="#FBC02D"/>
      <path d="M 220 150 C 240 130, 280 140, 290 190 C 280 195, 250 185, 220 150 Z" fill="#FDD835"/>

      <!-- Yellow Bell Pepper -->
      <circle cx="220" cy="135" r="26" fill="#FBC02D"/>
      <path d="M 218 108 C 216 98, 224 98, 222 110" stroke="#2E7D32" stroke-width="4.5" fill="none"/>

      <!-- Red Tomato -->
      <circle cx="190" cy="165" r="23" fill="#E53935"/>
      <path d="M 190 142 Q 187 136 193 136" stroke="#2E7D32" stroke-width="3.5" fill="none"/>

      <!-- Red Apple with Green Leaf -->
      <circle cx="305" cy="160" r="21" fill="#D32F2F"/>
      <ellipse cx="310" cy="140" rx="6" ry="3" fill="#388E3C" transform="rotate(-30, 310, 140)"/>

      <!-- Wooden Grocery Crate in Cart -->
      <rect x="125" y="150" width="175" height="65" rx="7" fill="#D4A373"/>
      <line x1="125" y1="175" x2="300" y2="175" stroke="#BC8A5F" stroke-width="2.5"/>

      <!-- Cart Handle & Basket Frame -->
      <path d="M 60 130 L 120 180 L 135 180" stroke="#0F8A3E" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Cart Main Basket Contour -->
      <path d="M 125 180 L 310 215 L 295 310 L 155 310 Z" fill="none" stroke="url(#cartGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      
      <!-- Grid Lines of Basket -->
      <line x1="160" y1="225" x2="175" y2="300" stroke="#0F8A3E" stroke-width="7" stroke-linecap="round"/>
      <line x1="205" y1="230" x2="215" y2="300" stroke="#0F8A3E" stroke-width="7" stroke-linecap="round"/>
      <line x1="250" y1="235" x2="255" y2="300" stroke="#0F8A3E" stroke-width="7" stroke-linecap="round"/>
      <line x1="140" y1="265" x2="285" y2="275" stroke="#0F8A3E" stroke-width="7" stroke-linecap="round"/>

      <!-- Cart Bottom Chassis & Axle -->
      <path d="M 155 310 L 155 335 L 285 335" stroke="#0A6B2E" stroke-width="11" stroke-linecap="round" fill="none"/>
      
      <!-- Cart Wheels -->
      <circle cx="160" cy="352" r="20" fill="#1B4332"/>
      <circle cx="160" cy="352" r="9" fill="#E8F5E9"/>
      
      <circle cx="275" cy="352" r="20" fill="#1B4332"/>
      <circle cx="275" cy="352" r="9" fill="#E8F5E9"/>
    </g>

    <!-- RIGHT: UNGA MARKET TYPOGRAPHY & SHOPPING ACCENTS -->
    <g transform="translate(340, 15)">
      <!-- Leaf & Sun Sprout over 'U' -->
      <g transform="translate(70, 0)">
        <circle cx="20" cy="30" r="16" fill="#FF5722"/>
        <path d="M 28 65 C 40 25, 90 15, 105 22 C 95 55, 65 75, 28 65 Z" fill="#2E7D32"/>
        <path d="M 28 65 Q 65 45, 105 22" stroke="#81C784" stroke-width="3" fill="none"/>
      </g>

      <!-- 'Unga' Cursive Script Style -->
      <text x="0" y="160" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="160" fill="url(#ungaGrad)" letter-spacing="-3">Unga</text>

      <!-- 'Market' Bold Sans Style -->
      <text x="0" y="295" font-family="'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="135" fill="url(#marketGrad)" letter-spacing="-1">Market</text>

      <!-- Orange Shopping Bag with Cursor Clicker on right -->
      <g transform="translate(445, 185)">
        <!-- Bag Handle -->
        <path d="M 26 24 C 26 -4, 72 -4, 72 24" fill="none" stroke="#2D6A4F" stroke-width="8" stroke-linecap="round"/>
        <!-- Bag Body -->
        <path d="M 8 28 L 90 28 L 100 102 L 0 102 Z" fill="url(#bagGrad)" rx="7"/>
        <!-- Star Burst & Sparkle -->
        <circle cx="42" cy="60" r="11" fill="#FFE082" opacity="0.6"/>
        <path d="M 42 42 L 42 78 M 24 60 L 60 60" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Mouse Pointer Arrow -->
        <polygon points="46,60 78,78 65,81 74,96 65,100 56,84 46,92" fill="#FFFFFF" stroke="#D84315" stroke-width="2"/>
      </g>

      <!-- Tagline: "— Your Everyday, Our Priority! —" -->
      <g transform="translate(0, 328)">
        <line x1="0" y1="-6" x2="35" y2="-6" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>
        <text x="48" y="0" font-family="'Nunito', sans-serif" font-weight="800" font-size="25" fill="#1B4332" letter-spacing="0.5">Your Everyday, Our Priority!</text>
        <line x1="410" y1="-6" x2="445" y2="-6" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Smile Curve Underneath -->
      <path d="M 90 345 Q 260 380 430 345" stroke="#FF5722" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
